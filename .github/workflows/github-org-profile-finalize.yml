name: Inspect EvidenceBound GitHub Organization API

on:
  push:
    paths:
      - .github/workflows/github-org-profile-finalize.yml

permissions:
  contents: read

jobs:
  inspect-org-api:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.EVIDENCEBOUND_METADATA_ADMIN_TOKEN }}
    steps:
      - name: Require admin token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::Missing EVIDENCEBOUND_METADATA_ADMIN_TOKEN'; exit 1; }

      - name: Read current organization presentation
        shell: bash
        run: |
          set -euo pipefail
          gh api /orgs/evidencebound --jq '{login,name,email,blog,description,avatar_url}'
          gh api graphql -f query='query { organization(login:"evidencebound") { id avatarUrl pinnedItems(first:10, types:[REPOSITORY]) { nodes { ... on Repository { nameWithOwner } } } } }' --jq '.data.organization'

      - name: Inspect supported organization mutations
        shell: bash
        run: |
          set -euo pipefail
          echo 'UPDATE_ORGANIZATION_INPUT_FIELDS_BEGIN'
          gh api graphql -f query='query { __type(name:"UpdateOrganizationInput") { inputFields { name } } }' --jq '.data.__type.inputFields[].name' || true
          echo 'UPDATE_ORGANIZATION_INPUT_FIELDS_END'
          echo 'PIN_AVATAR_ORGANIZATION_MUTATIONS_BEGIN'
          gh api graphql -f query='query { __type(name:"Mutation") { fields { name } } }' --jq '.data.__type.fields[].name' | grep -Ei 'pin|avatar|organization' || true
          echo 'PIN_AVATAR_ORGANIZATION_MUTATIONS_END'

      - name: Verify canonical org fields
        shell: bash
        run: |
          set -euo pipefail
          org_json="$(gh api /orgs/evidencebound)"
          [[ "$(jq -r '.name' <<<"$org_json")" == 'EvidenceBound' ]]
          [[ "$(jq -r '.email' <<<"$org_json")" == 'ruslan@evidencebound.org' ]]
          [[ "$(jq -r '.blog' <<<"$org_json")" == 'https://evidencebound.org' ]]
          [[ -n "$(jq -r '.description // empty' <<<"$org_json")" ]]
          echo 'EVIDENCEBOUND_GITHUB_ORG_FIELDS=PASS'
