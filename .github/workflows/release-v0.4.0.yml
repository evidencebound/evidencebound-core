name: Release v0.4.0

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact main SHA approved for v0.4.0 publication
        required: true
        type: string
      confirmation:
        description: Type publish-v0.4.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-v0.4.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify exact accepted main and successful CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          accepted = os.environ["ACCEPTED_SHA"].strip()
          workflow_sha = os.environ["WORKFLOW_SHA"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "evidencebound-release-v0.4.0",
          }

          def request(path):
              req = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read())

          current_main = request("/git/ref/heads/main")["object"]["sha"]
          if accepted != workflow_sha or accepted != current_main:
              raise SystemExit(
                  f"refusing release: accepted={accepted} workflow={workflow_sha} main={current_main}"
              )

          query = urllib.parse.urlencode(
              {"head_sha": accepted, "event": "push", "status": "completed", "per_page": 100}
          )
          runs = request(f"/actions/workflows/ci.yml/runs?{query}")["workflow_runs"]
          successful = [
              run
              for run in runs
              if run.get("head_sha") == accepted and run.get("conclusion") == "success"
          ]
          if not successful:
              raise SystemExit(
                  f"refusing release: no successful CI push run for exact SHA {accepted}"
              )
          print(f"EXACT_HEAD_CI_RUN={successful[0]['id']}")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.accepted_sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build exact source
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.5.1"
          python -m build

      - name: Verify built package identity
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import version
          import evidencebound

          assert version("evidencebound-core") == "0.4.0"
          assert evidencebound.__version__ == "0.4.0"
          print("release-package-version=0.4.0")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencebound-core-v0.4.0-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  tag:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or verify release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          TAG: v0.4.0
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          accepted = os.environ["ACCEPTED_SHA"]
          tag = os.environ["TAG"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "evidencebound-release-v0.4.0",
          }

          def request(path, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          try:
              ref = request(f"/git/ref/tags/{tag}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              ref = request(
                  "/git/refs",
                  method="POST",
                  payload={"ref": f"refs/tags/{tag}", "sha": accepted},
              )

          if ref["object"]["sha"] != accepted:
              raise SystemExit(
                  f"refusing release: {tag} points to {ref['object']['sha']}, expected {accepted}"
              )
          print(f"TAG_VERIFIED={tag}@{accepted}")
          PY

  publish-pypi:
    needs: tag
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/evidencebound-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evidencebound-core-v0.4.0-dists
          path: dist

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true

  release:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify PyPI and publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          TAG: v0.4.0
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = "0.4.0"
          package = "evidencebound-core"
          pypi_url = f"https://pypi.org/pypi/{package}/{version}/json"
          pypi = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(pypi_url, timeout=30) as response:
                      pypi = json.loads(response.read())
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
                  time.sleep(5)

          if pypi is None or pypi.get("info", {}).get("version") != version:
              raise SystemExit("refusing GitHub Release: live PyPI v0.4.0 readback failed")

          filenames = {item.get("filename", "") for item in pypi.get("urls", [])}
          if not any(name.endswith(".whl") for name in filenames):
              raise SystemExit("refusing GitHub Release: PyPI wheel missing")
          if not any(name.endswith(".tar.gz") for name in filenames):
              raise SystemExit("refusing GitHub Release: PyPI sdist missing")

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          accepted = os.environ["ACCEPTED_SHA"]
          tag = os.environ["TAG"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "evidencebound-release-v0.4.0",
          }

          def request(path, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          ref = request(f"/git/ref/tags/{tag}")
          if ref["object"]["sha"] != accepted:
              raise SystemExit("release verification failed: tag SHA mismatch")

          try:
              release = request(f"/releases/tags/{tag}")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              notes = (
                  "EvidenceBound Core v0.4.0 freezes the signed-receipt/key-lifecycle, "
                  "durable persistence/restart, maintained Google ADK compatibility, "
                  "canonicalization/conformance, and supply-chain hardening developed "
                  "since v0.3.0. No AgenTrust-specific semantics are included.\n\n"
                  "Publication is bound to the exact accepted main SHA and a successful "
                  "exact-head CI run. PyPI Trusted Publishing is verified before this "
                  "GitHub Release is created."
              )
              release = request(
                  "/releases",
                  method="POST",
                  payload={
                      "tag_name": tag,
                      "target_commitish": accepted,
                      "name": "EvidenceBound Core v0.4.0",
                      "body": notes,
                      "draft": False,
                      "prerelease": False,
                  },
              )

          if release.get("tag_name") != tag or release.get("draft") or release.get("prerelease"):
              raise SystemExit("release verification failed: GitHub Release metadata mismatch")
          if request(f"/git/ref/tags/{tag}")["object"]["sha"] != accepted:
              raise SystemExit("release verification failed: final tag SHA mismatch")

          print(
              json.dumps(
                  {
                      "sha": accepted,
                      "tag": tag,
                      "github_release": release.get("html_url"),
                      "pypi": f"https://pypi.org/project/{package}/{version}/",
                      "verified": True,
                  },
                  sort_keys=True,
              )
          )
          PY
