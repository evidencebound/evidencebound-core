name: Reference Spatial Visual Capture
on:
  push:
    branches:
      - feature/xoyk-reference-stage-2026-10-27
    paths:
      - .github/workflows/xoyk-reference-capture.yml
      - tools/site_reference_visual_probe.py
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser probe
        run: python -m pip install playwright==1.57.0
      - name: Capture public reference visually without copying source
        run: |
          set -euo pipefail
          mkdir -p reference-qa
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=6500 --screenshot=reference-qa/xoyk-desktop.png https://xoyk.dev/ || true
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=6500 --screenshot=reference-qa/xoyk-mobile.png https://xoyk.dev/ || true
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1400 --virtual-time-budget=6500 --screenshot=reference-qa/xoyk-tall.png https://xoyk.dev/ || true
          curl -L -sS -I --max-time 20 https://xoyk.dev/ > reference-qa/reference-http-headers.txt || true
          file reference-qa/*.png || true
          python tools/site_reference_visual_probe.py
          sha256sum reference-qa/*.png > reference-qa/SHA256SUMS.txt
          git rev-parse HEAD > reference-qa/RESEARCH_HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xoyk-reference-capture-${{ github.sha }}
          path: reference-qa/
          retention-days: 7
