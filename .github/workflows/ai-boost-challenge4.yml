name: AI-BOOST Challenge 4 SPARK Benchmark

on:
  push:
    branches: ["ai-boost-challenge-4"]
  pull_request:
    paths:
      - "src/evidencebound_scenariograph/**"
      - "benchmarks/ai_boost_challenge4/**"
      - "tests/test_ai_boost_challenge4_*"
      - ".github/workflows/ai-boost-challenge4.yml"

permissions:
  contents: read

jobs:
  spark-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run retained SPARK benchmark receipt
        run: python benchmarks/ai_boost_challenge4/run.py --assert-targets
