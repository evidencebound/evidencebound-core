name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python examples/golden_acceptance.py
      - run: python -m compileall -q src examples benchmarks
      - if: matrix.python-version == '3.13'
        run: ruff check . --output-format=github
      - if: matrix.python-version == '3.13'
        run: mypy src/evidencebound
      - if: matrix.python-version == '3.13'
        run: python -m build
      - if: matrix.python-version == '3.13'
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - if: matrix.python-version == '3.13'
        run: python -c "from evidencebound import EvidenceBound; print('clean-install-import-ok')"
