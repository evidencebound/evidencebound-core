name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python examples/golden_acceptance.py
      - run: python -m compileall -q src examples benchmarks
      - if: matrix.python-version == '3.13'
        run: ruff check . --output-format=github
      - if: matrix.python-version == '3.13'
        name: Run strict mypy with annotations
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          process = subprocess.run(
              ["mypy", "src/evidencebound", "--show-error-codes"],
              capture_output=True,
              text=True,
          )
          output = process.stdout + process.stderr
          print(output, end="")
          pattern = re.compile(r"^([^:]+):(\d+): error: (.*)$")
          for raw in output.splitlines():
              match = pattern.match(raw)
              if match:
                  path, line, message = match.groups()
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file={path},line={line}::{message}")
          sys.exit(process.returncode)
          PY
      - if: matrix.python-version == '3.13'
        run: python -m build
      - if: matrix.python-version == '3.13'
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - if: matrix.python-version == '3.13'
        run: python -c "from evidencebound import EvidenceBound; print('clean-install-import-ok')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit runtime dependency graph
        run: python -m pip_audit --progress-spinner=off .
      - name: Scan core Python source
        run: bandit -r src/evidencebound -q
