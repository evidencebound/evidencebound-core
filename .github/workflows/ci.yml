name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python examples/golden_acceptance.py
      - run: python -m compileall -q src examples benchmarks compat
      - if: matrix.python-version == '3.13'
        name: Run selective-recovery benchmark acceptance
        run: python benchmarks/selective_recovery.py
      - if: matrix.python-version == '3.13'
        run: ruff check . --output-format=github
      - if: matrix.python-version == '3.13'
        name: Run strict mypy with annotations
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          process = subprocess.run(
              ["mypy", "src/evidencebound", "--show-error-codes"],
              capture_output=True,
              text=True,
          )
          output = process.stdout + process.stderr
          print(output, end="")
          pattern = re.compile(r"^([^:]+):(\d+): error: (.*)$")
          for raw in output.splitlines():
              match = pattern.match(raw)
              if match:
                  path, line, message = match.groups()
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file={path},line={line}::{message}")
          sys.exit(process.returncode)
          PY
      - if: matrix.python-version == '3.13'
        run: python -m build
      - if: matrix.python-version == '3.13'
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - if: matrix.python-version == '3.13'
        run: python -c "from evidencebound import EvidenceBound; print('clean-install-import-ok')"
      - if: matrix.python-version == '3.13'
        name: Verify built wheel exposes PEP 561 typing marker
        run: |
          python - <<'PY'
          from importlib.resources import files

          marker = files("evidencebound").joinpath("py.typed")
          assert marker.is_file(), f"missing PEP 561 marker: {marker}"
          print("pep561-marker-present")
          PY

  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Create isolated environment
        run: python -m venv .clean-venv
      - name: Install only the runtime package from this checkout
        run: .clean-venv/bin/python -m pip install .
      - name: Verify runtime package exposes PEP 561 typing marker
        run: |
          .clean-venv/bin/python - <<'PY'
          from importlib.resources import files

          marker = files("evidencebound").joinpath("py.typed")
          assert marker.is_file(), f"missing PEP 561 marker: {marker}"
          print("pep561-marker-present-clean-room")
          PY
      - name: Run plain Python integration from isolated environment
        run: .clean-venv/bin/python examples/plain_python.py
      - name: Run golden external acceptance from isolated environment
        run: .clean-venv/bin/python examples/golden_acceptance.py
      - name: Confirm no unconditional runtime dependencies are declared
        run: |
          .clean-venv/bin/python - <<'PY'
          from importlib.metadata import requires

          declared = requires("evidencebound-core") or []
          unconditional = [requirement for requirement in declared if "extra ==" not in requirement]
          assert not unconditional, f"unexpected runtime requirements: {unconditional}"
          print("runtime-dependencies-none")
          PY

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit runtime dependency graph
        run: python -m pip_audit --progress-spinner=off .
      - name: Scan core Python source
        run: bandit -r src/evidencebound -q

  google-adk-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install EvidenceBound without integration dependencies
        run: python -m pip install .
      - name: Confirm ADK is not an EvidenceBound runtime dependency
        run: |
          python - <<'PY'
          from importlib.metadata import requires

          declared = requires("evidencebound-core") or []
          unconditional = [requirement for requirement in declared if "extra ==" not in requirement]
          assert not unconditional, f"unexpected runtime requirements: {unconditional}"
          assert not any("google-adk" in requirement.lower() for requirement in declared), declared
          print("google-adk-not-declared-by-evidencebound")
          PY
      - name: Install exact tested Google ADK version
        run: python -m pip install 'google-adk==2.7.0'
      - name: Report exact Google ADK version and validate environment
        run: |
          python - <<'PY'
          from importlib.metadata import version

          installed = version("google-adk")
          assert installed == "2.7.0", installed
          print(f"GOOGLE_ADK_VERSION={installed}")
          PY
          python -m pip check
      - name: Run real Google ADK lifecycle compatibility acceptance
        run: python compat/google_adk_v2_7.py
