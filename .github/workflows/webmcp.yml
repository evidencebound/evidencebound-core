name: WebMCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  webmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Report Node version
        run: node --version
      - name: Syntax-check browser modules
        run: |
          node --check site/webmcp/control-core.mjs
          node --check site/webmcp/webmcp-adapter.mjs
          node --check site/webmcp/app.mjs
      - name: Run WebMCP unit and adversarial tests
        run: node --test site/webmcp/*.test.mjs
