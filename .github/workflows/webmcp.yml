name: WebMCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  webmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: ""
      - name: Report Node version
        run: node --version
      - name: Run WebMCP unit and adversarial tests
        run: node --test site/webmcp/*.test.mjs
