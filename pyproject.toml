[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebound-core"
version = "0.3.0"
description = "Framework-agnostic trust, provenance, verification, and selective-recovery runtime for autonomous AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ruslan Vrublevskyi"}]
keywords = ["ai-safety", "agents", "provenance", "verification", "recovery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/moneyparking/evidencebound-core"
Issues = "https://github.com/moneyparking/evidencebound-core/issues"
Changelog = "https://github.com/moneyparking/evidencebound-core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/moneyparking/evidencebound-core/blob/main/docs/INTEGRATION.md"

[project.optional-dependencies]
crypto = ["cryptography>=46"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "cryptography>=46"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidencebound = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["evidencebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
